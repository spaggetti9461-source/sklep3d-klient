<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Studio & Sklep</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #1a73e8; font-size: 28px; margin-top: 0; margin-bottom: 8px; font-weight: 800; }
        .subtitle { color: #5f6368; margin-bottom: 20px; font-size: 15px; }
        .product-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .product-card { background: #f8f9fa; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .product-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #202124; }
        .product-price { color: #5f6368; font-size: 14px; }
        .btn-add { background: #1a73e8; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-add:hover { background: #1557b0; }
        .cart-section { background: #e8f0fe; border-radius: 12px; padding: 18px; margin-top: 20px; }
        .cart-section h2 { color: #1a73e8; margin-top: 0; font-size: 22px; font-weight: 800; }
        .cart-items { list-style: none; padding: 0; margin: 12px 0; }
        .cart-items li { padding: 6px 0; border-bottom: 1px dashed #aecbfa; display: flex; justify-content: space-between; font-size: 14px; }
        .total-price { font-size: 16px; font-weight: bold; color: #202124; margin-top: 10px; text-align: right; }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { width: 100%; background: #34a853; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 12px; cursor: pointer; }
        .btn-submit:hover { background: #2d8e47; }
    </style>
</head>
<body>

    <div class="container">
        <h1>3D Print Studio & Sklep</h1>
        <div class="subtitle">Wybierz produkty z druku 3D:</div>

        <div class="product-list">
            <div class="product-card">
                <div>
                    <div class="product-title">iPhone 13</div>
                    <div class="product-price">15 zł</div>
                </div>
                <button class="btn-add" onclick="dodajDoKoszyka('iPhone 13', 15)">Dodaj</button>
            </div>

            <div class="product-card">
                <div>
                    <div class="product-title">iPhone 16 (Basic)</div>
                    <div class="product-price">15 zł</div>
                </div>
                <button class="btn-add" onclick="dodajDoKoszyka('iPhone 16 (Basic)', 15)">Dodaj</button>
            </div>

            <div class="product-card">
                <div>
                    <div class="product-title">iPhone 17 Pro Max</div>
                    <div class="product-price">20 zł</div>
                </div>
                <button class="btn-add" onclick="dodajDoKoszyka('iPhone 17 Pro Max', 20)">Dodaj</button>
            </div>

            <div class="product-card">
                <div>
                    <div class="product-title">iPhone 17 Pro Max Camera Bump</div>
                    <div class="product-price">25 zł</div>
                </div>
                <button class="btn-add" onclick="dodajDoKoszyka('iPhone 17 Pro Max Camera Bump', 25)">Dodaj</button>
            </div>

            <div class="product-card">
                <div>
                    <div class="product-title">iPhone 17 Pro Max Full</div>
                    <div class="product-price">30 zł</div>
                </div>
                <button class="btn-add" onclick="dodajDoKoszyka('iPhone 17 Pro Max Full', 30)">Dodaj</button>
            </div>

            <div class="product-card">
                <div>
                    <div class="product-title">Kostka NeeDoh (pomarańczowa)</div>
                    <div class="product-price">25 zł</div>
                </div>
                <button class="btn-add" onclick="dodajDoKoszyka('Kostka NeeDoh (pomarańczowa)', 25)">Dodaj</button>
            </div>
        </div>

        <div class="cart-section">
            <h2>Twój Koszyk</h2>
            <ul id="cart-items" class="cart-items">
                <li>Brak produktów w koszyku</li>
            </ul>
            <div class="total-price">Suma: <span id="total-price">0</span> zł</div>

            <input type="text" id="customer-info" placeholder="Twoje imię / numer telefonu / e-mail">
            <button class="btn-submit" onclick="zlozZamowienie()">Złóż zamówienie</button>
        </div>
    </div>

    <script>
        let koszyk = [];
        let suma = 0;

        function dodajDoKoszyka(nazwa, cena) {
            koszyk.push({ nazwa, cena });
            suma += cena;
            aktualizujKoszyk();
        }

        function aktualizujKoszyk() {
            const lista = document.getElementById('cart-items');
            const totalElem = document.getElementById('total-price');
            lista.innerHTML = '';
            
            if (koszyk.length === 0) {
                lista.innerHTML = '<li>Brak produktów w koszyku</li>';
            } else {
                koszyk.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${item.nazwa}</span> <strong>${item.cena} zł</strong>`;
                    lista.appendChild(li);
                });
            }
            totalElem.textContent = suma;
        }

        function zlozZamowienie() {
            const kontakt = document.getElementById('customer-info').value.trim();

            if (!kontakt) {
                alert('Proszę podać swoje imię lub dane kontaktowe!');
                return;
            }
            if (koszyk.length === 0) {
                alert('Koszyk jest pusty!');
                return;
            }

            const opisZamowienia = koszyk.map(i => `${i.nazwa} (${i.cena} zł)`).join(', ');

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    access_key: 'Ccdffb10-bccf-497c-beea-3034703ccee1',
                    subject: `Nowe zamówienie od: ${kontakt}`,
                    from_name: kontakt,
                    message: `Dane zamawiającego: ${kontakt}\n\nZamówienie:\n${opisZamowienia}\n\nSuma: ${suma} zł`
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Zamówienie zostało wysłane pomyślnie!');
                    koszyk = [];
                    suma = 0;
                    document.getElementById('customer-info').value = '';
                    aktualizujKoszyk();
                } else {
                    alert('Błąd podczas wysyłania zamówienia. Spróbuj ponownie.');
                }
            })
            .catch(error => {
                alert('Błąd połączenia z siecią.');
            });
        }
    </script>
</body>
</html>
